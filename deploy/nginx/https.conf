limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server_tokens off;
ssl_certificate /etc/letsencrypt/live/weiduoxian.cn/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/weiduoxian.cn/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
server {
    listen 80 default_server;
    server_name _;
    location / { return 404; }
}
server {
    listen 80;
    server_name weiduoxian.cn www.weiduoxian.cn app.weiduoxian.cn admin.weiduoxian.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name weiduoxian.cn www.weiduoxian.cn;
    root /srv/sites/official;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
    include /etc/nginx/api.inc;
}
server {
    listen 443 ssl;
    server_name app.weiduoxian.cn;
    root /srv/sites/customer;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api.inc;
}
server {
    listen 443 ssl;
    server_name admin.weiduoxian.cn;
    root /srv/sites/admin;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api.inc;
}
