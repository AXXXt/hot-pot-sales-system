limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server_tokens off;
server {
    listen 80 default_server;
    server_name _;
    location / { return 404; }
}
server {
    listen 80;
    server_name weiduoxian.cn www.weiduoxian.cn;
    root /srv/sites/official;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ =404; }
    include /etc/nginx/api.inc;
}
server {
    listen 80;
    server_name app.weiduoxian.cn;
    root /srv/sites/customer;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api.inc;
}
server {
    listen 80;
    server_name admin.weiduoxian.cn;
    root /srv/sites/admin;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api.inc;
}
