name: Verify launch readiness
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: miniprogram_ci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/miniprogram_ci_test
      TEST_DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/miniprogram_ci_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: ci-minio-test
      MINIO_SECRET_KEY: ci-minio-test-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --silent
      - run: npx prisma migrate deploy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build pinned upstream MinIO and start isolated object storage
        run: |
          GOBIN="$RUNNER_TEMP/qa-minio-bin" CGO_ENABLED=0 go install github.com/minio/minio@RELEASE.2025-01-20T14-49-07Z
          mkdir -p "$RUNNER_TEMP/qa-minio-data"
          MINIO_ROOT_USER="$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            nohup "$RUNNER_TEMP/qa-minio-bin/minio" server "$RUNNER_TEMP/qa-minio-data" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/qa-minio.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qa-minio.log"
          exit 1
      - run: npm run test:integration
      - run: npm run build
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            web-customer/package-lock.json
      # Root tests load both Vite configurations; each config needs its own plugins.
      - run: npm ci --prefix admin-web
      - run: npm ci --prefix web-customer
      - run: node --test tests/*.test.js deploy/test/*.test.cjs
      # Worker fixtures enforce the same root ownership as the production worker.
      - run: sudo python3 -m unittest discover -s deploy/test -p 'test_*.py'
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, web-customer]
    defaults:
      run:
        working-directory: '${{ matrix.app }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: '${{ matrix.app }}-test-results'
          path: '${{ matrix.app }}/test-results/'
